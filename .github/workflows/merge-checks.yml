name: Merge gate checks
run-name: 'Tests for pull request #${{ github.event.pull_request.number }} against ${{ github.event.pull_request.base.ref }}'
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      checkout_ref:
        type: string
        required: false
        default: ''
permissions:
  contents: read
jobs:
  gate-tests:
    name: Merge gate regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate postmerge commit when supplied
        if: inputs.checkout_ref != ''
        env:
          MERGED_SHA: ${{ inputs.checkout_ref }}
        run: '[[ "$MERGED_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install pytest==9.1.1 pytest-socket==0.7.0 PyYAML==6.0.3 ruff==0.15.20
      - name: Verify jq and static Python checks
        run: |
          jq --version
          python -m ruff check .github/auto-merge
      - name: Synthetic GitHub and workflow contract tests
        run: python -m pytest -q --disable-socket --allow-unix-socket .github/auto-merge/tests
